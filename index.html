<script type="text/babel">
var useState=React.useState;
var useEffect=React.useEffect;

var MEMBERS=[
  {id:"hamabe",name:"浜辺",pin:"1111"},
  {id:"kambara",name:"神原",pin:"2222"},
  {id:"yamamoto",name:"山本",pin:"3333"},
  {id:"tomioka",name:"富岡",pin:"4444"},
  {id:"gushiken",name:"具志堅",pin:"5555"},
  {id:"handa",name:"半田",pin:"6666"}
];
var RATE=3300;
var RATE_EXCL=3000;

function pad(n){return n<10?"0"+n:""+n}
function fmtDate(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function monthKey(y,m){return y+"-"+pad(m)}
function prevMonthKey(){var d=new Date();var y=d.getFullYear();var m=d.getMonth();if(m===0){m=12;y--;}return monthKey(y,m)}
function curMonthKey(){var d=new Date();return monthKey(d.getFullYear(),d.getMonth()+1)}
function isFirstThreeDays(){return new Date().getDate()<=3}
function dim(y,m){return new Date(y,m,0).getDate()}
function parseYM(mk){var p=mk.split("-");return{year:parseInt(p[0]),month:parseInt(p[1])}}
// Get the dateKey for the day before a given dateKey
function prevDateKey(dk){
  var p=dk.split("-");var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function App(){
  var _p=useState("select"),page=_p[0],setPage=_p[1];
  var _u=useState(null),user=_u[0],setUser=_u[1];
  var _pin=useState(""),pin=_pin[0],setPin=_pin[1];
  var _su=useState(null),selUser=_su[0],setSelUser=_su[1];
  var _msg=useState(null),msg=_msg[0],setMsg=_msg[1];
  var _now=useState(new Date()),now=_now[0],setNow=_now[1];
  // Daily
  var _b1=useState(""),b1=_b1[0],setB1=_b1[1];
  var _b2=useState(""),b2=_b2[0],setB2=_b2[1];
  var _todayData=useState(null),todayData=_todayData[0],setTodayData=_todayData[1];
  var _yesterdayData=useState(null),yesterdayData=_yesterdayData[0],setYesterdayData=_yesterdayData[1];
  // Monthly
  var _monthlyData=useState(null),monthlyData=_monthlyData[0],setMonthlyData=_monthlyData[1];
  var _prevMonthly=useState(null),prevMonthly=_prevMonthly[0],setPrevMonthly=_prevMonthly[1];
  var _mPower=useState(""),mPower=_mPower[0],setMPower=_mPower[1];
  var _mRacks=useState(""),mRacks=_mRacks[0],setMRacks=_mRacks[1];
  var _showAlert=useState(false),showAlert=_showAlert[0],setShowAlert=_showAlert[1];
  var _mLastB1=useState(""),mLastB1=_mLastB1[0],setMLastB1=_mLastB1[1];
  var _mLastB2=useState(""),mLastB2=_mLastB2[0],setMLastB2=_mLastB2[1];
  // Admin
  var _at=useState("history"),adminTab=_at[0],setAdminTab=_at[1];
  var _histMonth=useState(curMonthKey()),histMonth=_histMonth[0],setHistMonth=_histMonth[1];
  var _histData=useState([]),histData=_histData[0],setHistData=_histData[1];
  var _monthList=useState([]),monthList=_monthList[0],setMonthList=_monthList[1];
  var _invoiceMonth=useState(prevMonthKey()),invoiceMonth=_invoiceMonth[0],setInvoiceMonth=_invoiceMonth[1];
  var _invoiceData=useState(null),invoiceData=_invoiceData[0],setInvoiceData=_invoiceData[1];

  useEffect(function(){var t=setInterval(function(){setNow(new Date());},1000);return function(){clearInterval(t);};},[]);

  function flash(m){setMsg(m);setTimeout(function(){setMsg(null);},3000);}

  function loadToday(){
    var tk=todayKey();
    var yk=prevDateKey(tk);
    db.collection("daily_gj").doc(tk).get().then(function(doc){
      if(doc.exists){setTodayData(doc.data());setB1(""+doc.data().b1_display);setB2(""+doc.data().b2_display);}
      else{setTodayData(null);setB1("");setB2("");}
    });
    db.collection("daily_gj").doc(yk).get().then(function(doc){
      if(doc.exists) setYesterdayData(doc.data());
      else setYesterdayData(null);
    });
    var mk=curMonthKey();
    db.collection("monthly").doc(mk).get().then(function(doc){
      if(doc.exists) setMonthlyData(doc.data());
      else setMonthlyData(null);
    });
    var pmk=prevMonthKey();
    db.collection("monthly").doc(pmk).get().then(function(doc){
      if(doc.exists) setPrevMonthly(doc.data());
      else setPrevMonthly(null);
    });
    if(isFirstThreeDays()){
      db.collection("monthly").doc(mk).get().then(function(doc){
        if(!doc.exists||!doc.data().b1_display) setShowAlert(true);
      });
    }
  }

  function loadHistoryWithRacks(mk){
    var ym=parseYM(mk);var nd=dim(ym.year,ym.month);
    var gjP=[];var rkP=[];
    for(var d=1;d<=nd;d++){
      var dk=mk+"-"+pad(d);
      gjP.push(db.collection("daily_gj").doc(dk).get().then(function(doc){return doc.exists?doc.data():null;}));
      rkP.push(db.collection("racks").doc(dk).get().then(function(doc){return doc.exists?doc.data():null;}));
    }
    Promise.all(gjP).then(function(gjR){
      Promise.all(rkP).then(function(rkR){
        var combined=gjR.map(function(g,i){
          var obj=g?Object.assign({},g):{};
          obj._rack=rkR[i]?rkR[i].count:null;
          return obj;
        });
        setHistData(combined);
      });
    });
  }

  function loadMonthList(){
    db.collection("monthly").orderBy("monthKey","desc").limit(24).get().then(function(snap){
      var list=[];snap.forEach(function(doc){list.push(doc.data());});setMonthList(list);
    });
  }

  function loadInvoice(mk){
    db.collection("monthly").doc(mk).get().then(function(doc){
      if(doc.exists) setInvoiceData(doc.data()); else setInvoiceData(null);
    });
  }

  function login(m){setUser(m);setPage("main");setMsg(null);loadToday();}
  function logout(){setUser(null);setPage("select");setPin("");setSelUser(null);setMsg(null);setB1("");setB2("");setTodayData(null);setYesterdayData(null);}

  // Save daily GJ - always overwrites
  function saveGJ(){
    var v1=parseFloat(b1);var v2=parseFloat(b2);
    if(isNaN(v1)||isNaN(v2)){flash("数値を入力してください");return;}
    var tk=todayKey();var now2=new Date();
    var data={dateKey:tk,b1_display:v1,b2_display:v2,userId:user.id,userName:user.name,time:now2.getTime(),timeStr:pad(now2.getHours())+":"+pad(now2.getMinutes())};

    function calcAndSave(prevB1,prevB2){
      if(prevB1!==null&&prevB2!==null){
        data.b1_gj=Math.round((v1-prevB1)*100)/100;
        data.b2_gj=Math.round((v2-prevB2)*100)/100;
        data.total_gj=Math.round((data.b1_gj+data.b2_gj)*100)/100;
        data.sales_invoice=Math.round(data.total_gj*RATE);
      }
      db.collection("daily_gj").doc(tk).set(data).then(function(){
        setTodayData(data);flash("GJ記録しました"+(data.total_gj?" ("+data.total_gj+" GJ)":""));
      });
    }

    // 前日のdaily_gjを探す
    var yk=prevDateKey(tk);
    db.collection("daily_gj").doc(yk).get().then(function(doc){
      if(doc.exists&&doc.data().b1_display!=null){
        calcAndSave(doc.data().b1_display,doc.data().b2_display);
      }else{
        // 前日データなし → 当月monthlyのprevLastDayを探す
        var cmk=curMonthKey();
        db.collection("monthly").doc(cmk).get().then(function(cDoc){
          if(cDoc.exists&&cDoc.data().prevLastDay_b1!=null){
            calcAndSave(cDoc.data().prevLastDay_b1,cDoc.data().prevLastDay_b2);
          }else{
            // 前月monthlyのlastDayを探す
            var pmk=prevMonthKey();
            db.collection("monthly").doc(pmk).get().then(function(mDoc){
              if(mDoc.exists&&mDoc.data().lastDay_b1!=null){
                calcAndSave(mDoc.data().lastDay_b1,mDoc.data().lastDay_b2);
              }else{
                // どこにもない → GJ計算なしで保存
                calcAndSave(null,null);
              }
            });
          }
        });
      }
    });
  }

  // Save monthly
  function saveMonthly(){
    var mk=curMonthKey();var now2=new Date();
    var v1=parseFloat(b1);var v2=parseFloat(b2);
    var pw=parseInt(mPower);var rk=parseInt(mRacks);
    var lb1=parseFloat(mLastB1);var lb2=parseFloat(mLastB2);
    var data={monthKey:mk,updated:now2.getTime()};
    if(!isNaN(v1)) data.b1_display=v1;
    if(!isNaN(v2)) data.b2_display=v2;
    if(!isNaN(pw)) data.power_meter=pw;
    if(!isNaN(rk)) data.prev_month_racks=rk;
    if(!isNaN(lb1)) data.prevLastDay_b1=lb1;
    if(!isNaN(lb2)) data.prevLastDay_b2=lb2;
    // Also save to prev month's monthly as lastDay
    if(!isNaN(lb1)&&!isNaN(lb2)){
      var pmk=prevMonthKey();
      db.collection("monthly").doc(pmk).set({lastDay_b1:lb1,lastDay_b2:lb2},{merge:true});
      // Also save as daily_gj for prev month's last day
      var prevYM=parseYM(pmk);var lastDay=dim(prevYM.year,prevYM.month);
      var lastDk=pmk+"-"+pad(lastDay);
      db.collection("daily_gj").doc(lastDk).set({dateKey:lastDk,b1_display:lb1,b2_display:lb2,userId:"system",userName:"月初入力",time:now2.getTime(),timeStr:"月初入力"},{merge:true});
    }
    if(prevMonthly&&data.b1_display&&data.b2_display){
      data.prev_b1_gj=Math.round((data.b1_display-(prevMonthly.b1_display||0))*100)/100;
      data.prev_b2_gj=Math.round((data.b2_display-(prevMonthly.b2_display||0))*100)/100;
      data.prev_total_gj=Math.round((data.prev_b1_gj+data.prev_b2_gj)*100)/100;
      data.prev_invoice=Math.round(data.prev_total_gj*RATE);
      data.prev_excl=Math.round(data.prev_total_gj*RATE_EXCL);
      data.prev_tax=data.prev_invoice-data.prev_excl;
      data.prev_consumption=Math.round(data.prev_total_gj/8.2*10)/10;
    }
    if(prevMonthly&&data.power_meter&&prevMonthly.power_meter){
      data.prev_power_usage=data.power_meter-prevMonthly.power_meter;
    }
    db.collection("monthly").doc(mk).set(data,{merge:true}).then(function(){
      setMonthlyData(data);setShowAlert(false);flash("月次データを保存しました");loadToday();
    });
  }

  // Admin save a specific day
  function adminSaveDay(dayNum){
    var dk=histMonth+"-"+pad(dayNum);
    var elB1=document.getElementById("adm-b1-"+dayNum);
    var elB2=document.getElementById("adm-b2-"+dayNum);
    var elRk=document.getElementById("adm-rk-"+dayNum);
    var v1=elB1?parseFloat(elB1.value):NaN;
    var v2=elB2?parseFloat(elB2.value):NaN;
    var rk=elRk?parseInt(elRk.value):NaN;
    if(isNaN(v1)&&isNaN(v2)&&isNaN(rk)){flash("値を入力してください");return;}
    // Save racks
    if(!isNaN(rk)){
      db.collection("racks").doc(dk).set({dateKey:dk,count:rk,userId:"admin",userName:"管理者",time:new Date().getTime()},{merge:true});
    }
    if(isNaN(v1)||isNaN(v2)){
      if(!isNaN(rk)){flash(dayNum+"日のラックを保存しました");loadHistoryWithRacks(histMonth);}
      return;
    }
    var data={dateKey:dk,b1_display:v1,b2_display:v2,userId:"admin",userName:"管理者",time:new Date().getTime(),timeStr:"管理者"};
    // 前日のdateKeyを計算
    var prevDk=prevDateKey(dk);
    console.log("adminSaveDay: day="+dayNum+" dk="+dk+" prevDk="+prevDk+" v1="+v1+" v2="+v2);
    // 1. まずFirestoreから前日のdaily_gjを取得
    db.collection("daily_gj").doc(prevDk).get().then(function(prevDoc){
      console.log("prevDoc exists="+prevDoc.exists,prevDoc.exists?prevDoc.data():null);
      if(prevDoc.exists&&prevDoc.data().b1_display!=null){
        var pd=prevDoc.data();
        data.b1_gj=Math.round((v1-pd.b1_display)*100)/100;
        data.b2_gj=Math.round((v2-pd.b2_display)*100)/100;
        data.total_gj=Math.round((data.b1_gj+data.b2_gj)*100)/100;
        data.sales_invoice=Math.round(data.total_gj*RATE);
        console.log("Calc from prevDoc: total_gj="+data.total_gj);
        doSave();
        return;
      }
      // 2. 前日daily_gjなし → 当月monthlyのprevLastDayを探す
      var dkParts=dk.split("-");var dkY=parseInt(dkParts[0]);var dkM=parseInt(dkParts[1]);
      var cmk=monthKey(dkY,dkM);
      console.log("Trying monthly(cur): "+cmk);
      db.collection("monthly").doc(cmk).get().then(function(cDoc){
        console.log("monthly(cur) exists="+cDoc.exists,cDoc.exists?cDoc.data():null);
        if(cDoc.exists&&cDoc.data().prevLastDay_b1!=null){
          var cd=cDoc.data();
          data.b1_gj=Math.round((v1-cd.prevLastDay_b1)*100)/100;
          data.b2_gj=Math.round((v2-cd.prevLastDay_b2)*100)/100;
          data.total_gj=Math.round((data.b1_gj+data.b2_gj)*100)/100;
          data.sales_invoice=Math.round(data.total_gj*RATE);
          console.log("Calc from monthly(cur).prevLastDay: total_gj="+data.total_gj);
          doSave();
          return;
        }
        // 3. 前月monthlyのlastDayを探す
        var pmY=dkM===1?dkY-1:dkY;var pmM=dkM===1?12:dkM-1;
        var pmk=monthKey(pmY,pmM);
        console.log("Trying monthly(prev): "+pmk);
        db.collection("monthly").doc(pmk).get().then(function(mDoc){
          console.log("monthly(prev) exists="+mDoc.exists,mDoc.exists?mDoc.data():null);
          if(mDoc.exists&&mDoc.data().lastDay_b1!=null){
            var md=mDoc.data();
            data.b1_gj=Math.round((v1-md.lastDay_b1)*100)/100;
            data.b2_gj=Math.round((v2-md.lastDay_b2)*100)/100;
            data.total_gj=Math.round((data.b1_gj+data.b2_gj)*100)/100;
            data.sales_invoice=Math.round(data.total_gj*RATE);
            console.log("Calc from monthly(prev).lastDay: total_gj="+data.total_gj);
          }else{
            console.log("No prev data found anywhere");
          }
          doSave();
        });
      });
    });
    function doSave(){
      console.log("Saving data:",JSON.stringify(data));
      db.collection("daily_gj").doc(dk).set(data).then(function(){
        if(data.total_gj!=null&&data.total_gj!==0){
          flash(dayNum+"日: "+data.total_gj+" GJ / \u00A5"+data.sales_invoice.toLocaleString());
        }else if(data.total_gj===0){
          flash(dayNum+"日: GJ=0（前日と同じ値です。各日のボイラー累積表示値を入力してください）");
        }else{
          flash(dayNum+"日: 保存済（前日データなし - 先に前日を入力してください）");
        }
        loadHistoryWithRacks(histMonth);
      });
    }
  }

  // PIN pad
  function pinPad(onComplete,onBack){
    return React.createElement("div",{style:{textAlign:"center"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:12,marginBottom:24}},
        [0,1,2,3].map(function(i){return React.createElement("div",{key:i,style:{width:52,height:60,borderRadius:10,background:"rgba(255,255,255,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,fontWeight:700,color:"#fff"}},pin.length>i?"\u25CF":"");})
      ),
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,maxWidth:280,margin:"0 auto"}},
        [1,2,3,4,5,6,7,8,9,"",0,"\u232B"].map(function(n,idx){
          if(n==="") return React.createElement("div",{key:idx});
          return React.createElement("button",{key:idx,onClick:function(){
            if(n==="\u232B") setPin(pin.slice(0,-1));
            else if(pin.length<4){var np=pin+n;setPin(np);if(np.length===4)onComplete(np);}
          },style:{width:"100%",padding:"16px 0",borderRadius:12,border:"none",background:n==="\u232B"?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.22)",color:"#fff",fontSize:24,fontWeight:700,cursor:"pointer"}},n);
        })
      ),
      msg?React.createElement("p",{style:{color:"#EF9A9A",marginTop:16,fontSize:16,fontWeight:600}},msg):null,
      React.createElement("button",{onClick:onBack,style:{marginTop:24,padding:"12px 32px",borderRadius:10,border:"2px solid #FFCC80",background:"transparent",color:"#FFCC80",fontSize:16,fontWeight:600,cursor:"pointer"}},"\u2190 戻る")
    );
  }

  var orangeBg={minHeight:"100vh",background:"linear-gradient(160deg,#E65100,#FF8F00)",display:"flex",flexDirection:"column",alignItems:"center",padding:"40px 20px 20px"};

  // === SELECT ===
  if(page==="select"){
    return React.createElement("div",{style:orangeBg},
      React.createElement("div",{style:{fontSize:13,color:"#FFCC80",letterSpacing:3,marginBottom:8}},"KOGANESEN"),
      React.createElement("h1",{style:{fontSize:28,fontWeight:900,color:"#fff",marginBottom:4}},"黄金泉 売上管理"),
      React.createElement("p",{style:{fontSize:14,color:"#FFE0B2",marginBottom:40}},"ボイラー熱量・売上・請求"),
      React.createElement("div",{style:{width:"100%",maxWidth:400}},
        React.createElement("p",{style:{color:"#FFE0B2",fontSize:16,marginBottom:16,textAlign:"center",fontWeight:600}},"名前を選んでください"),
        MEMBERS.map(function(m){
          return React.createElement("button",{key:m.id,onClick:function(){setSelUser(m);setPin("");setPage("pin");},style:{width:"100%",padding:"18px 24px",marginBottom:10,borderRadius:14,border:"none",background:"rgba(255,255,255,0.18)",color:"#fff",fontSize:20,fontWeight:800,cursor:"pointer",textAlign:"center",letterSpacing:2}},m.name);
        }),
        React.createElement("button",{onClick:function(){setPage("admin_pin");setPin("");setMsg(null);},style:{width:"100%",padding:"14px",marginTop:20,borderRadius:10,border:"2px solid #FFCC80",background:"transparent",color:"#FFCC80",fontSize:14,fontWeight:600,cursor:"pointer"}},"\uD83D\uDD12 管理者ログイン")
      )
    );
  }
  // === PIN ===
  if(page==="pin"&&selUser){
    return React.createElement("div",{style:orangeBg},
      React.createElement("p",{style:{color:"#fff",fontSize:22,fontWeight:800,marginBottom:4}},selUser.name+" さん"),
      React.createElement("p",{style:{color:"#FFE0B2",fontSize:16,marginBottom:24}},"4桁の暗証番号を入力"),
      pinPad(function(np){if(np===selUser.pin)login(selUser);else{setPin("");setMsg("暗証番号が違います");setTimeout(function(){setMsg(null);},2000);}},
        function(){setSelUser(null);setPin("");setMsg(null);setPage("select");})
    );
  }
  // === ADMIN PIN ===
  if(page==="admin_pin"){
    return React.createElement("div",{style:Object.assign({},orangeBg,{justifyContent:"center"})},
      React.createElement("h2",{style:{color:"#fff",fontSize:24,fontWeight:800,marginBottom:8}},"\uD83D\uDD12 管理者ログイン"),
      React.createElement("p",{style:{color:"#FFE0B2",fontSize:14,marginBottom:24}},"管理者PINを入力"),
      pinPad(function(np){if(np==="0310"){setPage("admin");loadMonthList();loadHistoryWithRacks(curMonthKey());setPin("");}else{setPin("");setMsg("PINが違います");setTimeout(function(){setMsg(null);},2000);}},
        function(){setPage("select");setPin("");setMsg(null);})
    );
  }

  // === ADMIN ===
  if(page==="admin"){
    var hmYM=parseYM(histMonth);
    var hmDays=dim(hmYM.year,hmYM.month);
    var invoiceTotal=0;var gjSum=0;var rackSum=0;
    histData.forEach(function(d){
      if(d&&d.total_gj&&d.total_gj>0){gjSum+=d.total_gj;invoiceTotal+=d.sales_invoice||0;}
      if(d&&d._rack) rackSum+=d._rack;
    });

    return React.createElement("div",{style:{minHeight:"100vh",background:"#FFF8E1"}},
      // Header
      React.createElement("div",{style:{background:"linear-gradient(135deg,#E65100,#FF8F00)",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
